version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: flexliving_db
    environment:
      POSTGRES_USER: flexuser
      POSTGRES_PASSWORD: flexpassword
      POSTGRES_DB: flexliving
    ports:
      - "5432:5432"
    volumes:
      - flexliving_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flexliving_redis
    ports:
      - "6379:6379"
    volumes:
      - flexliving_redisdata:/data
    restart: unless-stopped

volumes:
  flexliving_pgdata:
  flexliving_redisdata:
